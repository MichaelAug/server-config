mqtt:
  enabled: false

tls:
  enabled: false

ffmpeg:
  hwaccel_args: preset-vaapi

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

cameras:
  outside:
    ffmpeg:
      inputs:
        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.239:554/Preview_01_sub
          roles:
            - detect

        - path: rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.0.239:554/Preview_01_main
          roles:
            - record

    detect:
      width: 640
      height: 480
      fps: 5

    objects:
      track:
         - person
         - car

    record:
      enabled: true
