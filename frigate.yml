mqtt:
  enabled: true
  host: host.containers.internal
  user: frigate
  password: '{FRIGATE_PASSWORD}'
  topic_prefix: frigate

go2rtc:
  streams:
    outside:
      - rtsp://admin:{FRIGATE_PASSWORD}@192.168.0.239:554/Preview_01_main
    outside_sub:
      - rtsp://admin:{FRIGATE_PASSWORD}@192.168.0.239:554/Preview_01_sub

tls:
  enabled: false

ffmpeg:
  hwaccel_args: preset-vaapi

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

cameras:
  outside:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/outside_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

        - path: rtsp://127.0.0.1:8554/outside
          input_args: preset-rtsp-restream
          roles:
            - record

    live:
      streams:
        Main stream: outside
        Substream: outside_sub

    snapshots:
      enabled: true
      retain:
        default: 7

    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5


    objects:
      track:
        - person
        - car
      filters:
        person:
          min_score: 0.4
          threshold: 0.6

    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 1
      alerts:
        retain:
          days: 7
          mode: all
      detections:
        retain:
          days: 7
          mode: all

    zones:
      front_drive:
        coordinates:
          0,0.183,0.366,0.05,0.577,0.049,1,0.316,0.926,0.649,0.786,1,0.289,1,0,0.612
        loitering_time: 0
        friendly_name: Front Drive

        inertia: 2
        enabled: true
    review:
      alerts:
        labels:
          - person
        required_zones: front_drive

      detections:
        labels:
          - car
        required_zones: []
    motion:
      threshold: 20
      contour_area: 10
      improve_contrast: true

      mask:
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates:
            1,0,0.487,0,0.22,0,0.23,0.097,0.367,0.047,0.583,0.048,1,0.313
version: 0.18-0

semantic_search:
  enabled: true
  model_size: small

face_recognition:
  enabled: false
  model_size: small

lpr:
  enabled: false

classification:
  bird:
    enabled: false
